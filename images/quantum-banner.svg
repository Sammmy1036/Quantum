<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Quantum by microTech" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Quantum by microTech</title>
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/><stop offset=".55" stop-color="#2f86ff"/><stop offset="1" stop-color="#1747c9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".5" r=".6">
      <stop offset="0" stop-color="#2f86ff" stop-opacity=".28"/><stop offset="1" stop-color="#2f86ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- background card, so the logo reads the same on GitHub's light and dark themes -->
  <rect width="960" height="240" rx="28" fill="#070b14"/>
  <rect width="960" height="240" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="958" height="238" rx="27" fill="none" stroke="#1d2a44"/>
  <!-- emblem -->
  <g transform="translate(70 52) scale(2.1)">
    <g filter="url(#soft)" opacity=".55">
      <path d="M46.5 49.5A24 24 0 1 1 55.2 34" fill="none" stroke="#2f86ff" stroke-width="8.5" stroke-linecap="round"/>
    </g>
    <path d="M46.5 49.5A24 24 0 1 1 55.2 34" fill="none" stroke="url(#qg)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M33 45l18.5 13.5H40.5z" fill="url(#qg)"/>
    <path d="M6 51C24 45 42 34 62 17c-11 15-27 29-45 36z" fill="#eaf5ff"/>
  </g>
  <!-- QUΛNTUM wordmark, drawn as shapes so it looks the same everywhere (no font needed) -->
  <g transform="translate(250 72)" fill="none" stroke="#f2f7ff" stroke-width="7" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- Q -->
    <rect x="3.5" y="3.5" width="57" height="49" rx="16"/><path d="M40 38 L64 58"/>
    <!-- U -->
    <path transform="translate(94 0)" d="M3.5 0 V34 Q3.5 52.5 22 52.5 H42 Q60.5 52.5 60.5 34 V0"/>
    <!-- Λ (the A) -->
    <path transform="translate(188 0) scale(.64 .56)" d="M0 100 L44.5 0 H55.5 L100 100 H89.5 L50 12 L10.5 100 Z" fill="#f2f7ff" stroke="none"/>
    <!-- N -->
    <path transform="translate(282 0)" d="M3.5 56 V3 L60.5 53 V0"/>
    <!-- T -->
    <path transform="translate(376 0)" d="M0 3.5 H64 M32 3.5 V56"/>
    <!-- U -->
    <path transform="translate(470 0)" d="M3.5 0 V34 Q3.5 52.5 22 52.5 H42 Q60.5 52.5 60.5 34 V0"/>
    <!-- M -->
    <path transform="translate(564 0)" d="M3.5 56 V3 L32 34 L60.5 3 V56"/>
  </g>
  <!-- by microTech / tagline -->
  <text x="252" y="170" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="6" fill="#8ea0bf">BY <tspan font-weight="700" letter-spacing="1.5" fill="#dbe9fb" font-size="20">microTech</tspan></text>
  <text x="890" y="170" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#5e7194">THE VERSE, IN YOUR REACH.</text>
</svg>
